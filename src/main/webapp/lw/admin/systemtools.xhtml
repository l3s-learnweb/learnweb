<ui:composition template="/WEB-INF/templates/layout/template.xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:faces="jakarta.faces"
                xmlns:lw="learnweb">

<ui:param name="pageTitle" value="#{msg.system_tools}"/>
<ui:param name="hasAccessPermission" value="#{userBean.admin}"/>

<ui:define name="breadcrumb">
    <lw:breadcrumb-item link="admin/index.jsf" title="#{msg.admin}">
        <ui:decorate template="/WEB-INF/templates/blocks/breadcrumb/nav_list_first.xhtml"/>
    </lw:breadcrumb-item>

    <lw:breadcrumb-item link="admin/systemtools.jsf" title="#{msg.system_tools}">
        <ui:decorate template="/WEB-INF/templates/blocks/breadcrumb/nav_list_admin.xhtml"/>
    </lw:breadcrumb-item>
</ui:define>

<ui:define name="center_layout">
    <h:form>
        <p:dashboard id="board" model="#{adminSystemBean.model}" styleClass="row" responsive="true" reordering="false">
            <p:panel id="memory" header="#{msg['admin.memory_usage']}">
                <p:panelGrid columns="2" contentStyleClass="row" columnClasses="col-6, col-6">
                    <h:outputText value="#{msg['admin.free_memory']}:"/>
                    <h:outputText value="#{adminSystemBean.runtimeInfo.freeMemory}"/>

                    <h:outputText value="#{msg['admin.total_memory']}:"/>
                    <h:outputText value="#{adminSystemBean.runtimeInfo.totalMemory}"/>

                    <h:outputText value="#{msg['admin.max_memory']}:"/>
                    <h:outputText value="#{adminSystemBean.runtimeInfo.maxMemory}"/>
                </p:panelGrid>
            </p:panel>

            <p:panel id="cache" header="#{msg['admin.objects_cache']}">
                <p:dataTable var="cache" value="#{adminSystemBean.cacheObjects}" styleClass="mb-3">
                    <p:column headerText="#{msg.name}"><h:outputText value="#{cache.name}"/></p:column>
                    <p:column headerText="#{msg.size}"><h:outputText value="#{cache.size}"/></p:column>
                    <p:column headerText="#{msg['admin.size_secondary']}"><h:outputText value="#{cache.sizeSecondary}"/></p:column>
                </p:dataTable>

                <p:commandButton actionListener="#{adminSystemBean.clearAllCaches()}" value="#{msg.clear_caches}" update="cache" styleClass="ui-button-danger"/>
            </p:panel>

            <p:panel id="maintenance" header="#{msg['admin.maintenance']}">
                <p:toggleSwitch value="#{config.maintenance}">
                    <p:ajax listener="#{adminSystemBean.onMaintenanceUpdate}"/>
                </p:toggleSwitch>
            </p:panel>

            <p:panel id="i18n" header="#{msg['admin.locales']}">
                <p:dataTable var="locale" value="#{adminSystemBean.localeObjects}" styleClass="mb-3">
                    <p:column headerText="#{msg['admin.locale']}"><h:outputText value="#{locale.locale}"/></p:column>
                    <p:column headerText="#{msg['admin.bundle_locale']}"><h:outputText value="#{locale.bundleLocale}"/></p:column>
                    <p:column headerText="#{msg['admin.bundle_size']}"><h:outputText value="#{locale.bundleSize}"/></p:column>
                </p:dataTable>

                <p:commandButton actionListener="#{adminSystemBean.clearLocales()}" value="#{msg.clear_caches}" update="i18n" styleClass="ui-button-danger"/>
            </p:panel>

            <p:panel id="solr_index" header="#{msg['admin.search_index']}">
                <p:panelGrid columns="2" contentStyleClass="row" columnClasses="col-6, col-6">
                    <h:outputText value="#{msg['admin.total_resources']}:"/>
                    <h:outputText value="#{adminSystemBean.totalResources}"/>

                    <h:outputText value="#{msg['admin.indexed_resources']}:"/>
                    <h:outputText value="#{adminSystemBean.indexedResources}"/>
                </p:panelGrid>

                <p:commandButton widgetVar="reindexBtn" actionListener="#{adminSystemBean.reindexResources()}" value="#{msg['admin.reindex']}" update="solr_index"
                                 styleClass="ui-button-danger mb-2" onclick="PF('reindexProgress').start();PF('reindexBtn').disable();$(this).next().show();"/>

                <p:progressBar widgetVar="reindexProgress" value="#{adminSystemBean.reindexProgress}" ajax="true"
                               labelTemplate="{value}%" styleClass="p-mt-3 collapse" global="false" interval="500">
                    <p:ajax event="complete" listener="#{adminSystemBean.onReindexComplete}"
                            oncomplete="PF('reindexBtn').enable();PF('reindexProgress').cancel();"/>
                </p:progressBar>
            </p:panel>

            <p:panel id="error_handling" header="#{msg['admin.test_error_handling']}">
                <p class="mb-2">
                    <h:commandButton value="#{msg['admin.throw_runtime_exception']}" action="#{adminSystemBean.throwRuntimeException}" styleClass="me-1"/>
                    <p:commandButton value="#{msg['admin.throw_runtime_exception']} (AJAX)" action="#{adminSystemBean.throwRuntimeException}"
                                     ajax="true" process="@this" update="@this"/>
                </p>
                <p class="mb-2">
                    <h:commandButton value="#{msg['admin.throw_sql_exception']}" action="#{adminSystemBean.throwSQLException}" styleClass="me-1"/>
                    <p:commandButton value="#{msg['admin.throw_sql_exception']} (AJAX)" action="#{adminSystemBean.throwSQLException}"
                                     ajax="true" process="@this" update="@this"/>
                </p>
                <p class="mb-2" faces:id="render_error">
                    <h:commandButton value="#{msg['admin.throw_render_exception']}" styleClass="me-1"/>
                    <p:commandButton value="#{msg['admin.throw_render_exception']} (AJAX)" ajax="true" process="@form" update="render_error"/>
                    <h:outputText value="#{adminSystemBean.throwRuntimeException()}" rendered="#{component.namingContainer.submitted}"/>
                </p>
                <p class="mb-0">
                    <h:commandButton value="#{msg['admin.throw_http_error']}" action="#{adminSystemBean.throwHttpException}" styleClass="me-1"/>
                    <p:commandButton value="#{msg['admin.throw_http_error']} (AJAX)" action="#{adminSystemBean.throwHttpException}"
                                     ajax="true" process="@this" update="@this"/>
                </p>
            </p:panel>

            <p:panel id="db_connections">
                <f:facet name="header">
                    <div class="d-flex">
                        <div class="me-auto">#{msg.database_connections}</div>
                        <div class="d-md-block d-flex flex-column">
                            <p:commandButton value="#{msg['admin.terminate_all']}" action="#{adminSystemBean.terminateAllProcesses()}" styleClass="ui-button-warning"/>
                        </div>
                    </div>
                </f:facet>

                <p:blockUI block="processTable" widgetVar="processTableOverlay">
                    <h:outputText value="#{msg.please_wait}"/>
                </p:blockUI>

                <p:dataTable id="processTable" var="process" value="#{adminSystemBean.databaseProcesses}" emptyMessage="#{msg['admin.no_open_connections']}">
                    <p:column headerText="#{msg.id}" sortBy="#{process.id}">
                        <h:outputText value="#{process.id}"/>
                    </p:column>

                    <p:column headerText="#{msg.username}" sortBy="#{process.user}">
                        <h:outputText value="#{process.user}"/>
                    </p:column>

                    <p:column headerText="#{msg['admin.host']}" sortBy="#{process.host}">
                        <h:outputText value="#{process.host}"/>
                    </p:column>

                    <p:column headerText="#{msg['admin.database']}" sortBy="#{process.db}">
                        <h:outputText value="#{process.db}"/>
                    </p:column>

                    <p:column headerText="#{msg['admin.command']}" sortBy="#{process.command}">
                        <h:outputText value="#{process.command}"/>
                    </p:column>

                    <p:column headerText="#{msg.time}" sortBy="#{process.time}">
                        <h:outputText value="#{process.time}"/>
                    </p:column>

                    <p:column headerText="#{msg['admin.state']}" sortBy="#{process.state}">
                        <h:outputText value="#{process.state}"/>
                    </p:column>

                    <p:column headerText="#{msg.info}" sortBy="#{process.info}">
                        <h:outputText value="#{process.info}"/>
                    </p:column>

                    <p:column headerText="#{msg['admin.progress']}" sortBy="#{process.progress}">
                        <h:outputText value="#{process.progress}"/>
                    </p:column>

                    <p:column styleClass="text-end">
                        <p:commandButton title="#{msg['admin.terminate']}" styleClass="ui-button-danger rounded-button ui-button-flat" actionListener="#{adminSystemBean.terminateProcess(process)}"
                                         process="@this" update="processTable" onstart="PF('processTableOverlay').show()" oncomplete="PF('processTableOverlay').hide()" icon="fas fa-hand">
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </p:panel>
        </p:dashboard>
    </h:form>
</ui:define>

</ui:composition>
