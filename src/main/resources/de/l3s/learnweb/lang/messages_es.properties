frontpage.course_description_yell = YELL/TELL es un proyecto de educación para toda la vida que reúne a alumnos, profesores, formadores y expertos de diferentes escuelas y procedencias (profesores de educación infantil, primaria, secundaria inferior y superior, formadores de profesores, profesores universitarios y desarrolladores informáticos). El objetivo general es fomentar el aprendizaje y la enseñanza entre iguales, así como la mejora profesional de los profesores de inglés como lengua extranjera en todos los niveles escolares.
