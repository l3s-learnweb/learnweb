frontpage.about_platform = Über {0}
frontpage.course_description_public = Diese Umgebung ist nicht für einen bestimmten Kurs vorgesehen. Jeder kann ein Benutzerkonto erstellen, um die Plattform zur Suche nach Bildungsressourcen im Web zu nutzen und diese mit anderen zu teilen.
frontpage.course_description_yell = YELL/TELL ist ein Projekt zur lebenslangen Lehrerbildung, das Auszubildende, Lehrkräfte, Ausbilder und Experten aus unterschiedlichen Schulen und Hintergründen (Kindergarten, Grundschule, Sekundarstufe I und II, Lehrerausbildung, Hochschule, Softwareentwicklung) zusammenbringt. Das übergeordnete Ziel ist es, kooperatives Peer-Learning und Peer-Teaching sowie die berufliche Weiterentwicklung von Lehrkräften für Englisch als Fremdsprache über alle Schulstufen hinweg zu fördern.
