transcript_note = Puoi evidenziare e annotare porzioni di testo (singole parole o parti più lunghe). Per farlo, seleziona il testo desiderato. Dopo la selezione, puoi cliccare con il tasto destro sul testo evidenziato: il menu offre varie opzioni per aggiungere un'annotazione, aggiungere una definizione di WordNet (se disponibile) e cambiare il colore dell'evidenziazione. Dopo aver aggiunto un'annotazione o una definizione di WordNet, passando il puntatore del mouse sul testo evidenziato questa viene mostrata come suggerimento. Puoi visualizzare le annotazioni aggiunte cliccando su "Mostra tag" nel menu "Opzioni".

