survey.mod_placeholder_text = Label of the input for the placeholder (example text) of a survey question in the editor
survey.mod_header_text = Label of the header text input for a survey page or header element in the editor
survey.mod_max_length = Label of the maximum answer length input of a text question in the survey editor
survey.mod_max_length_tooltip = Tooltip of the maximum answer length input of a text question in the survey editor
survey.mod_no_condition = Survey editor: first option of the condition question dropdown, meaning always visible.
survey.mod_option = Placeholder of the input for an answer option in the survey question editor
survey.mod_page_condition = Survey editor: heading of the settings that show a page only if a question was answered with given answers.
survey.mod_question_text = Label of the input for the question text in the survey question editor
survey.mod_question_condition = Survey editor: heading of the settings that show a question only if another question was answered with a given answer.
survey.mod_question_type = Label of the question type select in the survey question editor
survey.mod_required = Label of the checkbox in the survey question editor to mark the question as mandatory
survey.mod_required_tooltip = Tooltip of the "required" checkbox in the survey question editor
survey.mod_required_answer = Survey editor, visibility condition: the answer(s) to the selected question that make the page/question visible.
survey.mod_exposable = Label of the checkbox in the survey question editor to make the question exposable
survey.mod_exposable_tooltip = Tooltip of the "exposable" checkbox in the survey question editor
survey.mod_tabs_questions = Tab title in the survey resource view for editing the questions
survey.mod_tabs_responses = Tab title in the survey resource view listing the responses
survey.mod_tabs_answer = Tab title in the survey resource view showing a preview of the answer form

suspicious_activity = Panel header on the admin banlist page

suspicious_activity_message = Explanation text in the suspicious activity panel on the admin banlist page

system_tools = Page title, breadcrumb and menu item for the admin system tools page

table_view = Tooltip of the button (resources and group members) and tab title (dashboard activity) that switches to the table view

tag_added = Growl message shown after a tag was added to a resource

tag_deleted = Message shown after a tag was deleted from a resource

tags = Label/title for tags: tab title on the TED transcript page, column header in admin statistics and the My tags page, heading in the resource details, label in search result details, and title of the tags filter in search

tags_hashtag = Text (HTML) of the "incorrect tags" dialog on the resource page when a new tag contains "#"; followed by the tag with "#" replaced by spaces as a hint

tags_spaces = Text (HTML) of the "incorrect tags" dialog on the resource page when a new tag contains more than three spaces (more than four words)

tags_specialCharacter = Text (HTML) of the "incorrect tags" dialog on the resource page when a new tag contains a comma

tags_tooLong = Text (HTML) of the "incorrect tags" dialog on the resource page when a new tag is rejected for any other reason, usually because it is too long

tedTalk = Column header for the TED talk title in the admin transcript logs

tedTranscriptHelp = Help text on the TED transcript page

tedTranscriptTitle = Page title and breadcrumb of the TED transcript page

ted_transcript.no_transcripts = Shown in the transcript language select if a video has no transcripts

ted_transcript.owner_of_transcript = Label on the TED transcript page before the name of the transcript owner
ted_transcript.submitted_successfully = Notification after a user submitted their annotated TED transcript

text_analysis = Menu item, page title and breadcrumb of the admin text analysis page

text_analysis_comments_count = Text on the admin text analysis page; {0} = number of comments, {1} = number of selected users

theme = Panel header on the profile page for selecting the color theme and label in the organisation admin form

theme.auto = Option in the theme select on the profile page (follow system setting)
theme.dark = Option in the theme select on the profile page (dark theme)
theme.light = Option in the theme select on the profile page (light theme)

thumb_ratings = Column header for thumb ratings in the rated resources table on the user's page

time = Column header for the time in the processes table of the admin system tools page and in the admin requests table

time_active = Column header and sorting parameter in the tracker dashboard, time the user was active on a page

time_stamp = Column header for a timestamp in admin tables (banlist, requests, transcript logs)

time_stay = Column header in the tracker dashboard, time the user stayed on a page

time_zone = Label of the time zone select on the profile page

title = Label for title input fields and column headers (groups, announcements, etc.)

title_already_taken = Validation error shown when a group title is already used

toggle_comments = Label of a toggle button on the admin statistics page to show or hide comments

toggle_description = Label of a toggle button on the admin statistics page to show or hide descriptions

toggle_details = Tooltip of a button that toggles (hides/shows) the right panel in the resource view
toggle_navigation = Public pages header: accessible label of the menu button on small screens.

total_events = Column header for the total number of events in the tracker dashboard

transcript = Page title, breadcrumb, panel header and menu item for the admin transcript page

transcript.gather_logs = Button label on the admin transcript log pages to gather logs of the selected users
transcript.no_definition = Tooltip on a highlighted word in a TED transcript when the user added a WordNet definition but WordNet has none for this word

transcript_log.deselection = Filter option in the action column of the admin detailed transcript log table: the user removed a highlight
transcript_log.display_definition = Filter option in the action column of the admin detailed transcript log table: the user displayed a WordNet definition
transcript_log.save_transcript = Filter option in the action column of the admin detailed transcript log table: the user saved the transcript
transcript_log.selection = Filter option in the action column of the admin detailed transcript log table: the user highlighted text
transcript_log.submit_transcript = Filter option in the action column of the admin detailed transcript log table: the user submitted the transcript

transcript_logs = Table header on the admin transcript log pages

transcript_note = Help note on the TED transcript page explaining how to highlight and annotate text

transcript_submit_message = Note on the TED transcript page shown when the transcript was already submitted, so highlighting and annotating is disabled

transcript_summaries = Menu item, page title and breadcrumb of the admin transcript summaries page

transcript_warning = Note on the TED transcript page shown when the user cannot edit the resource, so highlighting and annotating is disabled

type = Label and column header for the resource type (resource tables and create resource dialog) and title of the type filter in search

unban = Button tooltip and confirmation text on the admin banlist to remove a ban; followed by the banned address

university = Label of the university input on the registration form

update = Button label on the admin requests page to update the aggregated requests

updated_resources = Text in the group summary overview; {0} = number of updated resources (singular/plural choice)

uploadFiles = Label of the upload button of the file upload field in the create resource dialog (adding files)

upload_file = Menu item on the resources page to upload a file

upload_url = Menu item on the resources page to add a website by URL

url = Label for the website URL in the create resource dialog, and hidden (export only) column header in the Your information resources, groups and posts tables
url_verification_failed = Warning when adding a website resource whose URL could not be reached/validated; the process continues

user = Column header for the resource owner in the resources table view, the glossary owner in the glossary dashboard, and the user in the admin chat history

user.account.deleteSoft.button = Button on the profile page to delete the user's account
user.account.deleteSoft.confirmDescription = Confirmation dialog text (HTML) shown when the user clicks the delete account button on the profile page
user.account.deleted = Message shown after a user deleted their account on the profile page
user.account.guideReset.button = Button on the profile page to reset the interactive guide
user.account.guideSkip.button = Button on the profile page to skip the interactive guide
user.gender.FEMALE = Option in the gender select on the profile page and gender text in user details
user.gender.MALE = Option in the gender select on the profile page and gender text in user details
user.gender.OTHER = Option in the gender select on the profile page and gender text in user details
user.gender.UNASSIGNED = Option in the gender select on the profile page (gender not specified)

userAnnotation = Column header in the detailed transcript log and header of the annotation dialog on the TED transcript page

user_annotation_count = Column header for the number of user annotations in the simple transcript log
user_delete_transfer_leadership = Shown on the 400 error page when a user account that still leads groups is deleted permanently (e.g. when an admin deletes a course)

username = Label of the username input and column header (contact form, admin users, transcript logs)

username_already_taken = Validation error shown when the chosen username already exists (registration, profile)

username_banned = Error message on the 403 page when login is attempted with a banned username
username_too_short = Validation error of the username field on the registration page (minimum 2 characters)

users = Menu item, page title, breadcrumb and table heading of the admin users page; also row label for the number of users in the public statistics

users_selected = Text before the number of selected users in the admin user selection block

validation.please_confirm = Error text appended after the name of an unconfirmed required item: captcha (login, registration, contact form) or privacy statement checkbox (registration), e.g. "Privacy statement: please confirm"

value = Column header for the value in the public statistics table

videos = Title of the videos filter tab on the search page

chat = Title of the chat filter tab on the search page

votes = Number of votes in the resource details; {0} = number of votes (0 = not rated yet, 1 = one vote, more = plural)

web = Title of the web filter tab on the search page

website = Column header in the tracker dashboard for the visited website

welcome = Page title, breadcrumb and heading of the welcome page

welcome_message = Panel header/column header for the welcome message of a course or organisation

welcome_page = Label/column header for the welcome page of an organisation in admin

with = Connector in activity log entries about comments, between the resource and the comment text (e.g. "has commented on <resource> with <comment>")

with_query = Text in search activity log entries (welcome page, group overview, user page, resource history), inserted before the linked search query

word = Column header for the word in the detailed transcript log

wrong_username_or_password = Error message shown at login when credentials are incorrect

yell_purpose = Label of the YELL "Purpose of use" resource metadata field and search filter title (no need to translate)

yell_target = Label of the YELL "Target learner" resource metadata field and search filter title

yes = Label of the yes button in confirmation dialogs and boolean toggles

you_are_already_logged_in = Message shown on the front page and login page when the user is already logged in

your_info.activity_msg = Label on the Your information page about the user's activities on the site
your_info.courses_msg = Label on the Your information page; {0} = number of courses
your_info.groups_msg = Label on the Your information page; {0} = number of groups
your_info.history_msg = Label on the Your information page about the user's search history
your_info.intro_msg = Intro text on the Your information page
your_info.posts_msg = Label on the Your information page; {0} = number of forum posts
your_info.received_messages_msg = Label on the Your information page; {0} = number of received messages
your_info.received_msgs = Table title on the Your information messages page for received messages
your_info.resources_msg = Label on the Your information page; {0} = number of resources
your_info.sent_messages_msg = Label on the Your information page; {0} = number of sent messages
your_info.sent_msgs = Table title on the Your information messages page for sent messages
your_info.visit_group = Your information > groups: tooltip of the link to a group.
your_info.visit_post = Your information > forum posts: tooltip of the link to the user's forum post.

your_information = Title and breadcrumb of the Your information page

llm_chat_history = Menu item in the moderator menu to open the admin chat history page (users' conversations with the chat bot)
llm_chat = Tooltip of the chat button in the header to chat with a bot
llm_new_chat = Chat page: button that starts a new conversation with the bot.
llm_select_conversation = Chat page: tooltip of a conversation in the history list. {0} = conversation title.
llm_system_message = Chat page (moderators only) and admin chat history: heading of the system prompt that configures the bot.
llm_prompt = Chat page: field label of the system message (used in validation messages).
llm_prompt_placeholder = Chat page: placeholder of the message input field.
llm_assistant = Chat page and admin chat history: name shown above the replies of the bot.
llm_describe_prompt = Chat page: tooltip of the button that opens a survey about the user's prompt.
llm_describe_response = Chat page: tooltip of the button that opens a survey about the bot's response.
llm_regenerate = Chat page: tooltip of the button that generates a new reply to the last prompt.
llm_welcome = Chat page: welcome text of a new conversation. {0} = platform name (e.g. Learnweb). Rendered as HTML, keep <br/>.
llm_welcome_get_started = Chat page: second line of the welcome text of a new conversation.
llm_viewing_history = Chat page: shown when an earlier conversation is opened. {0} = date and time the conversation was started.
llm_continue_anytime = Chat page: shown below llm_viewing_history.
